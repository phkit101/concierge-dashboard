<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grant Finder — Live API</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px;min-height:100vh}.app{max-width:1400px;margin:0 auto}.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:32px;padding:20px 24px;background:#1e293b;border-radius:16px;border:1px solid #334155}.header h1{font-size:1.8rem;font-weight:700;display:flex;align-items:center;gap:12px}.header h1 span{background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.header .badge{background:#22c55e;color:#0f172a;padding:4px 14px;border-radius:32px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.header .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.header .status-dot.running{background:#22c55e;animation:pulse 1.5s infinite}.header .status-dot.idle{background:#64748b}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}.stat-card{background:#1e293b;padding:18px 20px;border-radius:12px;border:1px solid #334155}.stat-card .number{font-size:2rem;font-weight:700;color:#3b82f6}.stat-card .label{font-size:.8rem;color:#94a3b8;margin-top:4px}.stat-card .number.green{color:#22c55e}.stat-card .number.orange{color:#f59e0b}.stat-card .number.purple{color:#8b5cf6}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding:16px 20px;background:#1e293b;border-radius:12px;border:1px solid #334155}.controls .btn{border:none;padding:10px 24px;border-radius:40px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb;transform:translateY(-1px)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-success{background:#22c55e;color:#0f172a}.btn-success:hover{background:#16a34a}.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}.btn-outline{background:0 0;border:1.5px solid #475569;color:#e2e8f0}.btn-outline:hover{border-color:#94a3b8;background:#334155}.btn-sm{padding:6px 14px;font-size:.8rem}.search-box{flex:1;min-width:200px;padding:10px 16px;border-radius:40px;border:1.5px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9rem;transition:.2s}.search-box:focus{outline:0;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}.search-box::placeholder{color:#64748b}.filter-select{padding:10px 16px;border-radius:40px;border:1.5px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9rem;cursor:pointer;min-width:140px}.filter-select:focus{outline:0;border-color:#3b82f6}.table-container{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow:hidden;margin-top:16px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}thead{background:#0f172a}th{text-align:left;padding:14px 16px;font-weight:600;color:#94a3b8;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #334155;white-space:nowrap}td{padding:14px 16px;border-bottom:1px solid #1e293b;vertical-align:middle}tr:hover td{background:#263548}.grant-status{display:inline-block;padding:2px 12px;border-radius:32px;font-size:.7rem;font-weight:600}.grant-status.open{background:#22c55e20;color:#22c55e;border:1px solid #22c55e40}.grant-status.closed{background:#ef444420;color:#ef4444;border:1px solid #ef444440}.grant-status.posted{background:#3b82f620;color:#60a5fa;border:1px solid #3b82f640}.grant-status.forecasted{background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b40}.grant-status.archived{background:#64748b20;color:#94a3b8;border:1px solid #64748b40}.grant-link{color:#60a5fa;text-decoration:none;font-size:.8rem;cursor:pointer}.grant-link:hover{text-decoration:underline;color:#93bbfc}.tag{display:inline-block;padding:2px 10px;border-radius:32px;font-size:.65rem;font-weight:600;background:#334155;color:#cbd5e1;margin:2px 4px 2px 0}.tag.housing{background:#3b82f620;color:#60a5fa}.tag.energy{background:#22c55e20;color:#4ade80}.tag.disaster{background:#f59e0b20;color:#fbbf24}.tag.rural{background:#8b5cf620;color:#a78bfa}.tag.health{background:#ec489920;color:#f472b6}.tag.education{background:#06b6d420;color:#67e8f9}.log-container{background:#0f172a;border-radius:12px;border:1px solid #334155;padding:16px 20px;margin-top:16px;max-height:200px;overflow-y:auto;font-family:'Courier New',monospace;font-size:.8rem}.log-container .log-entry{padding:4px 0;border-bottom:1px solid #1e293b;color:#94a3b8}.log-container .log-entry .time{color:#475569;margin-right:12px}.log-container .log-entry .info{color:#60a5fa}.log-container .log-entry .success{color:#4ade80}.log-container .log-entry .warning{color:#fbbf24}.log-container .log-entry .error{color:#f87171}@media(max-width:768px){body{padding:12px}.header{flex-direction:column;align-items:stretch;padding:16px}.controls{flex-direction:column}.stats-grid{grid-template-columns:1fr 1fr}th,td{padding:10px 12px;font-size:.8rem}}@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}.empty-state{text-align:center;padding:48px 16px;color:#64748b}.empty-state .emoji-big{font-size:3rem;display:block;margin-bottom:12px}.empty-state p{font-size:1rem}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center;padding:20px}.modal-overlay.active{display:flex}.modal{background:#1e293b;border-radius:16px;padding:32px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid #334155}.modal h2{margin-bottom:12px;color:#e2e8f0}.modal .close-btn{float:right;background:0 0;border:none;color:#94a3b8;font-size:1.5rem;cursor:pointer}.modal .close-btn:hover{color:#e2e8f0}.modal .detail-row{margin:8px 0;padding:8px 0;border-bottom:1px solid #334155}.modal .detail-row .label{color:#94a3b8;font-size:.75rem;text-transform:uppercase;letter-spacing:.3px}.modal .detail-row .value{color:#e2e8f0;margin-top:2px}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div><h1>🔍 <span>Grant Finder</span> Pipeline</h1>
<div style="font-size:.85rem;color:#94a3b8;margin-top:4px;">Live from Grants.gov API</div></div>
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
<span class="badge">⚡ Live API</span>
<span id="pipelineStatus"><span class="status-dot idle"></span> Idle</span>
</div>
</header>
<div class="stats-grid">
<div class="stat-card"><div class="number" id="totalGrants">0</div><div class="label">Total Grants</div></div>
<div class="stat-card"><div class="number green" id="openGrants">0</div><div class="label">Open / Active</div></div>
<div class="stat-card"><div class="number orange" id="avgAmount">$0</div><div class="label">Closed</div></div>
<div class="stat-card"><div class="number purple" id="lastScan">Never</div><div class="label">Last Scan</div></div>
</div>
<div class="controls">
<button class="btn btn-primary" id="runPipelineBtn">🚀 Run Pipeline</button>
<button class="btn btn-outline" id="clearGrantsBtn">🗑️ Clear All</button>
<input type="text" class="search-box" id="searchBox" placeholder="🔎 Search grants...">
<select class="filter-select" id="filterSelect">
<option value="all">All Status</option>
<option value="posted">Posted</option>
<option value="forecasted">Forecasted</option>
<option value="closed">Closed</option>
</select>
<select class="filter-select" id="categoryFilter">
<option value="all">All Categories</option>
<option value="housing">🏠 Housing</option>
<option value="energy">⚡ Energy</option>
<option value="disaster">🌊 Disaster</option>
<option value="rural">🌾 Rural</option>
</select>
</div>
<div class="table-container"><div class="table-scroll"><table>
<thead><tr><th>Grant Title</th><th>Agency</th><th>Status</th><th>Posted</th><th>Deadline</th><th>ALN</th><th>Link</th></tr></thead>
<tbody id="grantTableBody"><tr><td colspan="7"><div class="empty-state"><span class="emoji-big">🔍</span><p>No grants loaded. Click <strong>"Run Pipeline"</strong> to fetch live data.</p></div></td></tr></tbody>
</table></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
<h3 style="font-size:.9rem;color:#94a3b8;">📋 Pipeline Log</h3>
<button class="btn btn-outline btn-sm" id="clearLogBtn">Clear Log</button>
</div>
<div class="log-container" id="logContainer">
<div class="log-entry"><span class="time">[System]</span><span class="info">Ready to fetch live grants.</span></div>
</div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle">Grant Details</h2><div id="modalBody"></div></div>
</div>
<script>
const STORAGE_KEY='grant_pipeline_live';let grants=loadGrants(),logEntries=loadLog(),isRunning=!1;function loadGrants(){try{const e=localStorage.getItem(STORAGE_KEY);if(e){const t=JSON.parse(e);if(Array.isArray(t))return t}}catch(e){}return[]}function saveGrants(e){localStorage.setItem(STORAGE_KEY,JSON.stringify(e))}function loadLog(){try{const e=localStorage.getItem('grant_pipeline_live_log');if(e){const t=JSON.parse(e);if(Array.isArray(t))return t}}catch(e){}return[]}function saveLog(e){localStorage.setItem('grant_pipeline_live_log',JSON.stringify(e));e.length>200&&(e.splice(0,e.length-200),saveLog(e))}function addLog(e,t='info'){const n={time:new Date().toLocaleTimeString(),message:e,type:t,timestamp:Date.now()};logEntries.push(n),saveLog(logEntries),renderLog()}const GRANTS_API_URL='https://api.grants.gov/v1/api/search2';function detectCategory(e){const t=(e.title||'').toLowerCase(),n=(e.agencyName||'').toLowerCase(),s=(e.description||'').toLowerCase(),a=t+' '+n+' '+s,o={housing:['housing','home','repair','rehabilitation','construction','property','mortgage','shelter','cdbg','hud'],energy:['energy','solar','weatherization','heating','cooling','efficiency','renewable','electric','liheap'],disaster:['disaster','emergency','flood','hurricane','tornado','storm','fema','recovery'],rural:['rural','agriculture','usda','farm','country','remote','frontier'],health:['health','medical','hospital','clinic','mental','substance','treatment','hhs'],education:['education','school','student','teacher','training','workforce','college']};let r='other',c=0;for(const[e,l]of Object.entries(o)){let h=0;for(const d of l)a.includes(d)&&h++;h>c&&(c=h,r=e)}return r}async function fetchGrantsFromAPI(e=['home','housing','energy','repair','weatherization','low income']){const t=[];for(const n of e){try{addLog(`🔍 Searching: "${n}"`,'info');const e=await fetch(GRANTS_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:n,rows:25,oppStatuses:'forecasted|posted',startRecordNum:0})});if(!e.ok){addLog(`⚠️ API error: ${e.status}`,'error');continue}const s=await e.json();if(s.data&&s.data.oppHits&&s.data.oppHits.length>0){const e=s.data.oppHits;addLog(`✅ Found ${e.length} grants`,'success');for(const s of e){const e=t.some(e=>e.number===s.number);e||t.push({id:s.id||s.number,number:s.number||'',title:s.title||'Untitled',agencyCode:s.agencyCode||'',agencyName:s.agencyName||'Unknown Agency',status:s.oppStatus||'unknown',openDate:s.openDate||'',closeDate:s.closeDate||'',docType:s.docType||'',alnList:s.alnist||[],category:detectCategory(s),source:'Grants.gov API',foundDate:new Date().toISOString().split('T')[0]})}}else addLog(`ℹ️ No grants for "${n}"`,'warning');await new Promise(e=>setTimeout(e,300))}catch(e){addLog(`❌ Error: ${e.message}`,'error')}}return t}async function runPipeline(){if(isRunning)return;isRunning=!0,updateUIState(),addLog('🚀 Pipeline started...','info');try{const e=await fetchGrantsFromAPI(['home repair','weatherization','housing assistance','energy efficiency','low income housing','rural development','disaster recovery','home rehabilitation','heating assistance','roof repair']);if(0===e.length)addLog('⚠️ No grants found.','warning');else{const t=new Set(grants.map(e=>e.number)),n=e.filter(e=>!t.has(e.number));grants=[...grants,...n],saveGrants(grants),addLog(`✅ Found ${n.length} new grants.`,'success'),addLog(`📊 Total: ${grants.length}`,'success'),n.slice(0,5).forEach(e=>{addLog(`   • ${e.title} (${e.status})`,'info')}),n.length>5&&addLog(`   • ... and ${n.length-5} more.`,'info'),n.length<3&&addLog('💡 Try different keywords.','warning')}}catch(e){addLog(`❌ Pipeline error: ${e.message}`,'error')}isRunning=!1,updateUIState(),renderAll()}function renderStats(){const e=grants.length,t=grants.filter(e=>'posted'===e.status||'forecasted'===e.status).length,n=grants.filter(e=>'closed'===e.status).length;document.getElementById('totalGrants').textContent=e,document.getElementById('openGrants').textContent=t+' open';const s=logEntries.filter(e=>'success'===e.type||'info'===e.type).pop();document.getElementById('lastScan').textContent=s?new Date(s.timestamp).toLocaleDateString()+' '+new Date(s.timestamp).toLocaleTimeString():'Never',document.getElementById('avgAmount').textContent=n>0?n+' closed':'—'}function renderGrants(e='all',t='',n='all'){const s=document.getElementById('grantTableBody');let a=grants;'all'!==e&&(a=a.filter(t=>t.status===e)),'all'!==n&&(a=a.filter(e=>e.category===n)),t.trim()&&(t=t.toLowerCase(),a=a.filter(e=>(e.title||'').toLowerCase().includes(t)||(e.agencyName||'').toLowerCase().includes(t)||(e.number||'').toLowerCase().includes(t)));if(0===a.length){s.innerHTML=`<tr><td colspan="7"><div class="empty-state"><span class="emoji-big">📭</span><p>${0===grants.length?'No grants. Run pipeline.':'No matches.'}</p></div></td></tr>`;return}let o='';a.forEach(e=>{const t=e.status||'unknown',n={housing:'🏠 Housing',energy:'⚡ Energy',disaster:'🌊 Disaster',rural:'🌾 Rural',health:'🏥 Health',education:'📚 Education',other:'📌 Other'},a=n[e.category]||e.category||'Other',r=e.alnList&&e.alnList.length>0?e.alnList.join(', '):'—';o+=`<tr><td><strong style="color:#e2e8f0;font-size:.85rem;">${e.title||'Untitled'}</strong></td><td style="font-size:.8rem;color:#94a3b8;">${e.agencyName||'Unknown'}</td><td><span class="grant-status ${t}">${(e.status||'unknown').toUpperCase()}</span></td><td style="font-size:.8rem;color:#94a3b8;">${e.openDate||'N/A'}</td><td style="font-size:.8rem;color:#94a3b8;">${e.closeDate||'N/A'}</td><td style="font-size:.75rem;color:#94a3b8;">${r}</td><td><span class="grant-link" onclick="showGrantDetails('${e.id||e.number}')">View →</span></td></tr>`}),s.innerHTML=o,renderStats()}function renderLog(){const e=document.getElementById('logContainer'),t=logEntries.slice(-50);if(0===t.length){e.innerHTML='<div class="log-entry"><span class="time">[System]</span><span class="info">No log entries.</span></div>';return}let n='';t.forEach(e=>{const t=e.type||'info';n+=`<div class="log-entry"><span class="time">[${e.time}]</span><span class="${t}">${e.message}</span></div>`}),e.innerHTML=n,e.scrollTop=e.scrollHeight}function updateUIState(){const e=document.getElementById('pipelineStatus'),t=document.getElementById('runPipelineBtn');isRunning?(e.innerHTML='<span class="status-dot running"></span> Running...',t.disabled=!0,t.innerHTML='<span class="spinner"></span> Fetching...'):(e.innerHTML='<span class="status-dot idle"></span> Idle',t.disabled=!1,t.innerHTML='🚀 Run Pipeline')}function renderAll(){const e=document.getElementById('searchBox').value,t=document.getElementById('filterSelect').value,n=document.getElementById('categoryFilter').value;renderGrants(t,e,n),renderStats(),renderLog(),updateUIState()}function showGrantDetails(e){const t=grants.find(t=>t.id===e||t.number===e);if(!t)return;document.getElementById('modalOverlay').classList.add('active'),document.getElementById('modalTitle').textContent=t.title||'Grant Details',document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="label">Opportunity Number</div><div class="value">${t.number||'N/A'}</div></div><div class="detail-row"><div class="label">Agency</div><div class="value">${t.agencyName||'Unknown'}</div></div><div class="detail-row"><div class="label">Status</div><div class="value"><span class="grant-status ${t.status||'unknown'}">${(t.status||'unknown').toUpperCase()}</span></div></div><div class="detail-row"><div class="label">Posted Date</div><div class="value">${t.openDate||'N/A'}</div></div><div class="detail-row"><div class="label">Close Date</div><div class="value">${t.closeDate||'N/A'}</div></div><div class="detail-row"><div class="label">ALN / CFDA</div><div class="value">${t.alnList&&t.alnList.length>0?t.alnList.join(', '):'N/A'}</div></div><div class="detail-row"><div class="label">Category</div><div class="value">${t.category||'Other'}</div></div><div style="margin-top:16px;"><a href="https://www.grants.gov/search-results-detail/${t.number}" target="_blank" class="btn btn-primary" style="text-decoration:none;display:inline-block;">🔗 View on Grants.gov</a></div>`}function closeModal(){document.getElementById('modalOverlay').classList.remove('active')}document.getElementById('modalOverlay').addEventListener('click',function(e){e.target===this&&closeModal()}),document.getElementById('runPipelineBtn').addEventListener('click',runPipeline),document.getElementById('clearGrantsBtn').addEventListener('click',function(){confirm('Delete all grants?')&&(grants=[],saveGrants(grants),addLog('🗑️ All cleared.','warning'),renderAll())}),document.getElementById('clearLogBtn').addEventListener('click',function(){logEntries=[],saveLog(logEntries),renderLog()}),document.getElementById('searchBox').addEventListener('input',renderAll),document.getElementById('filterSelect').addEventListener('change',renderAll),document.getElementById('categoryFilter').addEventListener('change',renderAll),document.addEventListener('keydown',function(e){'Escape'===e.key&&closeModal(),(e.ctrlKey||e.metaKey)&&'Enter'===e.key&&!isRunning&&runPipeline()}),renderAll(),console.log('🔍 Grant Finder Pipeline — Live API'),console.log(`📊 ${grants.length} grants cached.`);
</script>
</body>
</html>
